<!DOCTYPE html>
<html>
<head>
  <title>Пример подключения плеера</title>
  <meta charset="utf-8">
  <link rel="stylesheet" href="./css/font-awesome.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
  <script src="https://unpkg.com/playable@2.10.3/dist/statics/playable.bundle.min.js"></script>
  <script src="./js/player.js"></script>
  
  <div id="player" class="player">
    <div class="js-video-container video_container"></div>
      <div class="menu_navigation">
        <button class="js-play-button player_button" hidden><i class="fa fa-play" aria-hidden="true"></i></button>
        <button class="js-pause-button player_button" hidden><i class="fa fa-pause" aria-hidden="true"></i></button>
        <button class="js-volume-button player_button" hidden><i class="fa fa-volume-off" aria-hidden="true"></i></button>
        <button class="js-mute-button player_button" hidden><i class="fa fa-volume-up" aria-hidden="true"></i></button>
      </div>
  </div>

  <script type="text/javascript">
    createPlayer({elementId: 'player'});
  </script>
</body>
</html>
